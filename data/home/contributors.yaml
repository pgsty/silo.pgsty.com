# Community members who have contributed to the pgsty/silo fork since it was established in 2026.
# Mirrors CONTRIBUTORS.md in the server repository; update both together at each release.
# GitHub generates no contributor graph for forks, so this list is maintained by hand.
# Project maintainers and automated accounts are intentionally excluded from this community roll.
#
# `name` is the account's GitHub display name, shown on hover; it falls back to the handle
# when the account has not set one. Avatars live in static/images/contributors/<handle>.webp
# and are refreshed with `python3 bin/contributor_avatars.py`.

