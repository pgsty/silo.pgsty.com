#=======================================#
# Basics
#=======================================#
baseURL: https://silo.pgsty.com/
title: SILO - S3-Compatible Object Storage by Pigsty
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
# 标签等列表页标题保留作者原始大小写（不要把 silo-pkg 渲染成 Silo-Pkg）。
capitalizeListTitles: false

services:
  googleAnalytics:
    id: G-JVPFK6E3P5

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.155.0"
  imports:
    - path: github.com/google/docsy
      disable: false

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: SILO
    params:
      description: S3-compatible object storage maintained by Pigsty
      time_format_blog: 'January 02, 2006'
    menu:
      main:
        - identifier: docs
          name: Docs
          weight: 10
          url: /docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: Blog
          weight: 20
          url: /blog/
          pre: <i class='fa-solid fa-blog'></i>
        - identifier: download
          name: Download
          weight: 25
          url: /download/
          pre: <i class='fa-solid fa-download'></i>
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.io
          pre: <i class='fa-solid fa-database'></i>
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/silo
          pre: <i class='fa-brands fa-github'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: SILO
    params:
      description: 由 Pigsty 持续维护的 S3 兼容对象存储
      time_format_blog: '2006年01月02日'
    menu:
      main:
        - identifier: docs
          name: 文档
          weight: 10
          url: /zh/docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: 博客
          weight: 20
          url: /zh/blog/
          pre: <i class='fa-solid fa-blog'></i>
        - identifier: download
          name: 下载
          weight: 25
          url: /zh/download/
          pre: <i class='fa-solid fa-download'></i>
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.cc
          pre: <i class='fa-solid fa-database'></i>
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/silo
          pre: <i class='fa-brands fa-github'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  module: module
  categories: categories
  tags: tags

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      # 数学公式。分隔符是按语料实际情况挑的，别改成常见的那几个：
      #   $...$   正文里有货币金额（$126M、$1B），会被吞成公式
      #   \[...\] 正文里有大量转义方括号（\[`PutObject`\]，RST 转换残留）
      # 剩下 \(...\) 与 $$...$$ 在全部语料里零出现，是安全的。
      # 渲染由页面 front matter 的 math: true 控制，见 layouts/_markup/render-passthrough.html
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, JSON]
  page: [HTML]
  section: [HTML, RSS]

#=======================================#
# Site parameters
#=======================================#
params:
  description: S3-compatible object storage maintained by Pigsty, with security updates, a restored console, and supply-chain continuity.
  images:
    - images/silo-social-card.png
  version: 0.1.0
  copyright:
    authors: PIGSTY & SILO Contributors
    from_year: 2020
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  # 页面 front matter 可单页覆盖（page_width: wide），栏目可经 cascade 继承。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  # 示例：footer_icp: 浙ICP备15016890号-2
  footer_icp: ""

  archived_version: false
  url_latest_version: https://silo.pgsty.com
  github_repo: https://github.com/pgsty/silo.pgsty.com
  github_project_repo: https://github.com/pgsty/silo
  github_branch: main

  # 站内搜索由项目自有的 ⌘K 弹窗实现（lunr 自托管 + 按语言索引），
  # 必须关闭 Docsy offlineSearch：否则其 offline-search.js 在页面上找不到
  # .td-search input 时会 $.ajax(undefined) 抓当前页 HTML 并抛错。
  offlineSearch: false
  prism_syntax_highlighting: false

  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    ul_show: 2
    showLightDarkModeMenu: true
    # TOC 高亮由 silo-docs.js 的 IntersectionObserver 实现；Docsy 的
    # Bootstrap ScrollSpy 注入路径（td/scrollspy-attr.txt）存在属性转义
    # bug，本就从未生效，禁用后顺带从 bundle 中去掉 scrollspy-patch.js。
    scrollSpy:
      disable: true
    # ---- Fumadocs 式侧栏定制（silo chrome）----
    # 搜索框下方的根节点下拉：列出 docs 根 + 所有 sidebar_root_for: self
    # 的 section；若无 self 根 section 则自动隐藏。
    sidebar_root_menu: true
    # 侧栏宽度（px）：默认宽随断点 268/286，可拖拽调整并持久化；
    # min/max 为拖拽钳制范围，可在栏目 front matter 中经 cascade 覆盖
    # （params.ui.sidebar_width_min / sidebar_width_max）。
    sidebar_width_min: 220
    sidebar_width_max: 480
    # 侧栏条目文字溢出策略：ellipsis（省略号，默认）| wrap（换行）。
    # 可在栏目 front matter 中经 cascade 覆盖（params.ui.sidebar_item_overflow）。
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    readingtime:
      enable: false

  links:
    user:
      - name: Silo source
        url: https://github.com/pgsty/silo
        icon: fab fa-github
        desc: Silo source repository
      - name: Pigsty
        url: https://pigsty.io
        icon: fa fa-database
        desc: Pigsty project
    developer:
      - name: Releases
        url: https://github.com/pgsty/silo/releases
        icon: fa fa-box-archive
        desc: Silo release artifacts
      - name: Documentation source
        url: https://github.com/pgsty/silo.pgsty.com
        icon: fab fa-github
        desc: Silo documentation repository
