#=======================================#
# Basics
#=======================================#
baseURL: https://silo.pgsty.com/
title: SILO - S3-Compatible Object Storage by Pigsty
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
# 标签等列表页标题保留作者原始大小写（不要把 silo-pkg 渲染成 Silo-Pkg）。
capitalizeListTitles: false

# 列表页每页条目数（博客列表、标签页等）。Hugo 默认 10，这里放宽到 20。
pagination:
  pagerSize: 20

services:
  googleAnalytics:
    id: G-JVPFK6E3P5

#=======================================#
# Hugo Module
#=======================================#
module:
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: SILO
    params:
      description: S3-compatible object storage maintained by Pigsty
      time_format_blog: 'January 02, 2006'
      time_format_default: 'January 02, 2006'
      upstream_copyright: "© 2020–Present MinIO, Inc."
    menu:
      main:
        - identifier: docs
          name: Docs
          weight: 10
          url: /docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: Blog
          weight: 20
          url: /blog/
          pre: <i class='fa-solid fa-blog'></i>
        - identifier: download
          name: Download
          weight: 25
          url: /download/
          pre: <i class='fa-solid fa-download'></i>
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.io
          pre: <i class='fa-solid fa-database'></i>
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/silo
          pre: <i class='fa-brands fa-github'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: SILO
    params:
      description: 由 Pigsty 持续维护的 S3 兼容对象存储
      time_format_blog: '2006年01月02日'
      time_format_default: '2006年01月02日'
      upstream_copyright: "© 2020–至今 MinIO, Inc."
    menu:
      main:
        - identifier: docs
          name: 文档
          weight: 10
          url: /zh/docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: 博客
          weight: 20
          url: /zh/blog/
          pre: <i class='fa-solid fa-blog'></i>
        - identifier: download
          name: 下载
          weight: 25
          url: /zh/download/
          pre: <i class='fa-solid fa-download'></i>
        - identifier: pigsty
          name: Pigsty
          weight: 30
          url: https://pigsty.cc
          pre: <i class='fa-solid fa-database'></i>
        - identifier: github
          name: GitHub
          weight: 40
          url: https://github.com/pgsty/silo
          pre: <i class='fa-brands fa-github'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  module: module
  categories: categories
  tags: tags

permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      # 数学公式。分隔符是按语料实际情况挑的，别改成常见的那几个：
      #   $...$   正文里有货币金额（$126M、$1B），会被吞成公式
      #   \[...\] 正文里有大量转义方括号（\[`PutObject`\]，RST 转换残留）
      # 剩下 \(...\) 与 $$...$$ 在全部语料里零出现，是安全的。
      # 渲染由页面 front matter 的 math: true 控制，见 layouts/_markup/render-passthrough.html
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: S3-compatible object storage maintained by Pigsty, with security updates, a restored console, and supply-chain continuity.
  logo: img/silo.svg
  # OINK uses one wordmark across the docs sidebar and mobile shell.
  wordmark: img/silo-word.svg
  images:
    - images/silo-social-card.webp
  version: 0.2.1
  copyright:
    authors: PIGSTY & SILO Contributors
    from_year: 2020
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  # 页面 front matter 可单页覆盖（page_width: wide），栏目可经 cascade 继承。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  # 示例：footer_icp: 浙ICP备15016890号-2
  footer_icp: ""

  # ---- 上游归属与署名 ----
  # 每页 front matter 只写 upstream_link（本页所改编的上游材料），其余常量在
  # 这里声明一次；upstream_copyright 分语言写在下面的 languages 块里。
  upstream_name: minio/docs
  upstream_license: CC-BY-4.0
  upstream_notice: /about/attribution/

  archived_version: false
  url_latest_version: https://silo.pgsty.com
  github_repo: https://github.com/pgsty/silo.pgsty.com
  github_project_repo: https://github.com/pgsty/silo
  github_branch: main

  # OINK 提供自托管的 Lunr、按语言生成的索引与 ⌘K 搜索弹窗。
  offline_search: true
  offline_search_index: content
  offline_search_summary_length: 90
  offline_search_max_results: 10
  highlight_classes: true

  ui:
    blog_index_size: 20
    quick_links: [docs, blog]
    page_context_menu:
      enable: true
      links: []
    breadcrumb: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    sidebar_expand_levels: 2
    dark_mode: true
    # OINK 的文档壳自行维护 TOC 高亮，不需要 Bootstrap ScrollSpy。
    scroll_spy: false
    # ---- OINK 文档壳 ----
    # 搜索框下方的根节点下拉：列出 docs 根 + 所有 sidebar_root_for: self
    # 的 section；若无 self 根 section 则自动隐藏。
    sidebar_root_menu: true
    # 侧栏宽度（px）：默认宽随断点 268/286，可拖拽调整并持久化；
    # min/max 为拖拽钳制范围，可在栏目 front matter 中经 cascade 覆盖
    # （params.ui.sidebar_width_min / sidebar_width_max）。
    sidebar_width_min: 220
    sidebar_width_max: 480
    # 侧栏条目文字溢出策略：ellipsis（省略号，默认）| wrap（换行）。
    # 可在栏目 front matter 中经 cascade 覆盖（params.ui.sidebar_item_overflow）。
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    reading_time: false
    # 译文页脚提示：权威版本是英文版；原生中文页可用 translation_notice: false 关闭。
    translation_notice: en
