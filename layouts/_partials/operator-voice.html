{{- $v := .voice -}}
{{- $zh := .zh -}}
{{- $kind := cond $zh (default $v.kind $v.kindZh) $v.kind -}}
{{- $who := cond $zh (default $v.who $v.whoZh) $v.who -}}
<a class="operator-voice{{ with $v.variant }} operator-voice--{{ . }}{{ end }}" href="{{ $v.href }}" target="_blank" rel="noopener">
  <span class="voice-kind silkscreen"><i aria-hidden="true"></i>{{ $kind }}</span>
  <blockquote{{ with $v.lang }} lang="{{ . }}"{{ end }}>“{{ $v.quote }}”</blockquote>
  <footer><strong>{{ $who }}</strong><span>{{ $v.src }}</span><i aria-hidden="true">↗</i></footer>
</a>
