name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check bilingual documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      HUGO_MODULE_WORKSPACE: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Record build tool versions
        run: |
          go version
          hugo version
          python3 --version

      - name: Test, build and verify internal links
        run: env -u HUGO_MODULE_REPLACEMENTS make check
